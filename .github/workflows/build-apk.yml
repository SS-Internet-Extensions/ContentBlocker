name: Build APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build content-blocker APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare release keystore
        env:
          ADGUARD_KEYSTORE_BASE64: ${{ secrets.ADGUARD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ADGUARD_KEYSTORE_BASE64" ]; then
            printf '%s' "$ADGUARD_KEYSTORE_BASE64" | base64 -d > adguard_cb/adguard.keystore
          else
            rm -f adguard_cb/adguard.keystore
            keytool -genkeypair \
              -keystore adguard_cb/adguard.keystore \
              -storepass adguard \
              -keypass adguard \
              -alias adguard \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ContentBlocker CI,O=ContentBlocker,C=US" \
              -noprompt
          fi

      - name: Run unit tests
        run: ./gradlew :adguard_cb:testProdProdBackendDebugUnitTest --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

      - name: Build release APK
        run: ./gradlew :adguard_cb:assembleProdProdBackendRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: content-blocker-android
          path: content-blocker-android.apk
          if-no-files-found: error
