name: Build APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build content-blocker APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD:-adguard}"
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          KEY_ALIAS="${KEY_ALIAS:-adguard}"

          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > adguard_cb/adguard.keystore
          else
            rm -f adguard_cb/adguard.keystore
            keytool -genkeypair \
              -keystore adguard_cb/adguard.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ContentBlocker CI,O=ContentBlocker,C=US" \
              -noprompt
          fi

      - name: Run unit tests
        run: ./gradlew :adguard_cb:testProdProdBackendDebugUnitTest --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

      - name: Build release APK
        run: ./gradlew :adguard_cb:assembleProdProdBackendRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

      - name: List APK outputs
        run: find adguard_cb/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: content-blocker-android
          path: adguard_cb/build/outputs/apk/**/*.apk
          if-no-files-found: error
